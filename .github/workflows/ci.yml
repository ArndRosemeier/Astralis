name: Astralis quality gate
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: python -m unittest discover -s packages/catalog/tests -v
      - run: pnpm soak -- --games=12
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: astralis-production
          path: dist
